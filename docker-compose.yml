
services:
  # ==================================================
  # API — Aplicação Node.js / Express
  # ==================================================
  api:
    # Constrói a imagem utilizando o Dockerfile da raiz.
    build:
      context: .
      dockerfile: Dockerfile

    # Nome do container.
    container_name: contracts-api

    # Reinicia automaticamente, exceto quando parado manualmente.
    restart: unless-stopped

    # Mapeia a porta da máquina para a porta do container.
    ports:
      - "${PORT}:3000"

    # Variáveis de ambiente recebidas pela aplicação.
    environment:
      NODE_ENV: production
      PORT: ${PORT}

      # Conexão com PostgreSQL.
      # "postgres" é o nome do serviço no Docker Compose.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Conexão com Redis.
      # "redis" é o nome do serviço no Docker Compose.
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}

    # Aguarda PostgreSQL e Redis passarem nos healthchecks.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================================================
  # POSTGRESQL — Banco de dados relacional
  # ==================================================
  postgres:
    # Imagem oficial do PostgreSQL.
    image: postgres:16-alpine

    # Nome do container.
    container_name: postgres

    # Política de reinicialização.
    restart: unless-stopped

    # Expõe a porta do banco para a máquina host.
    ports:
      - "${DB_PORT:-5432}:5432"

    # Credenciais e banco inicial obtidos do .env.
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    # Mantém os dados mesmo que o container seja recriado.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # Verifica se o PostgreSQL está aceitando conexões.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # REDIS — Armazenamento em memória
  # ==================================================
  redis:
    # Imagem oficial do Redis.
    image: redis:7-alpine

    # Nome do container.
    container_name: contracts-redis

    # Política de reinicialização.
    restart: unless-stopped

    # Expõe a porta Redis para a máquina host.
    ports:
      - "${REDIS_PORT}:6379"

    # Persiste os arquivos de dados no volume.
    # A persistência depende da configuração do Redis.
    volumes:
      - redisdata:/data

    # Verifica se o Redis responde ao comando PING.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==================================================
# VOLUMES — Persistência dos dados
# ==================================================
volumes:
  # Dados do PostgreSQL.
  pgdata:

  # Dados persistidos pelo Redis.
  redisdata:
