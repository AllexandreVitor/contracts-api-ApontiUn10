name: DevSecOps Pipeline - API

on:
    push:
        branches: [ main ]

    pull_request:
        branches: [ main ]
    workflow_dispatch: {}

jobs:
  
  # =============================================
  # 1. Secret Scanning
  # =============================================
  gitleaks:
    name: 1. Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
            fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================
  # 2. SAST
  # =============================================
  sast:
    name: 2. SAST com Semgrep
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config p/nodejs

  # =============================================
  # 3. Lint e qualidade de código
  # =============================================
  lint:
    name: 3. Lint e qualidade do código
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # =============================================
  # 4. Build da imagem Docker
  # =============================================
  docker-build:
    name: 4. Build da imagem Docker
    runs-on: ubuntu-latest

    needs: lint

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validar Docker Compose
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-password
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t contratos-api:${{ github.sha}} .
      
      - name: Scan da imagem Docker com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'contratos-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'