name: DevSecOps Pipeline - API

on:
    push:
        branches: [ main ]

    pull_request:
        branches: [ main ]
    workflow_dispatch: {}

jobs:
  
  # =============================================
  # 1. Secret Scanning
  # =============================================
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
            fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================
  # 2. SAST
  # =============================================
  sast:
    name: 2. SAST com Semgrep
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config p/nodejs